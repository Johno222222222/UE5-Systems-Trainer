name: Bug report
description: Something in the training tool broke or showed the wrong lesson.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: The version on Help or in the window title, such as 1.19.0.
      placeholder: 1.19.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Windows, macOS, or Linux, plus the version if you know it.
      placeholder: Windows 11
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you clicked, and what the app did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
