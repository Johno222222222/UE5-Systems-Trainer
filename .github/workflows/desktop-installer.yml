name: Desktop installer

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

# contents: write lets a version tag publish a Release.
# actions: write keeps the installer artifact upload working.
permissions:
  contents: write
  actions: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install and build the workspace UI
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build
        env:
          CI: true

      - name: Install the desktop shell
        run: npm ci

      - name: Build the Windows installer
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # TODO(Azure Artifact Signing): signing is intentionally off.
          # When the certificate is ready, add these repository secrets
          # (do not commit the values) and uncomment the lines below:
          #   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
          # Then set "signAndEditExecutable": true in package.json and add
          # win.azureSignOptions (publisherName, endpoint, codeSigningAccountName,
          # certificateProfileName). Until then this installer stays unsigned.
          # AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Upload the installer
        uses: actions/upload-artifact@v5
        with:
          name: ue5-system-architect-windows
          path: release/*.exe
          if-no-files-found: error

  macos:
    name: macOS archive
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install and build the workspace UI
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build
        env:
          CI: true

      - name: Install the desktop shell
        run: npm ci

      - name: Build the unsigned macOS archive
        run: npx electron-builder --mac dmg zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload the macOS archive
        uses: actions/upload-artifact@v5
        with:
          name: ue5-system-architect-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install and build the workspace UI
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build
        env:
          CI: true

      - name: Install the desktop shell
        run: npm ci

      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Build the AppImage and deb
        run: npx electron-builder --linux AppImage deb --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload the Linux packages
        uses: actions/upload-artifact@v5
        with:
          name: ue5-system-architect-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  plugin-includes:
    name: Plugin include check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check plugin includes against their engine modules
        run: node --test desktop/test/plugin-includes.test.js

  # One release step after the builds, so macOS and Linux never race to create the tag.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && always()
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        if: needs.windows.result == 'success' || needs.macos.result == 'success' || needs.linux.result == 'success'
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish one release
        if: needs.windows.result == 'success' || needs.macos.result == 'success' || needs.linux.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" out/* --title "$tag" --generate-notes --verify-tag
          else
            gh release upload "$tag" out/* --clobber
          fi
