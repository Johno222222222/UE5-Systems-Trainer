name: Desktop installer

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

# contents: write lets this workflow create or update a GitHub Release and upload installers to it.
# actions: write lets the cleanup job delete Actions artifacts. Release assets are a different API and are never listed or deleted.
permissions:
  contents: write
  actions: write

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Create or reuse the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v*.*.* ]]; then
            tag="${GITHUB_REF_NAME}"
            kind="release"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -n "${PR_NUMBER}" ]]; then
            tag="preview-pr-${PR_NUMBER}"
            kind="preview"
          else
            safe="$(printf '%s' "${GITHUB_REF_NAME}" | tr '/ ' '--')"
            tag="preview-${safe}"
            kind="preview"
          fi
          if [[ "$kind" == "preview" && "$tag" == v*.*.* ]]; then
            echo "Refusing to create or modify a version release from a preview build."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Reusing ${tag}"
          elif [[ "$kind" == "release" ]]; then
            gh release create "$tag" --repo "$GH_REPO" --title "$tag" --generate-notes --verify-tag --latest
          else
            gh release create "$tag" --repo "$GH_REPO" \
              --title "Preview ${tag}" \
              --notes "Installer preview for ${GITHUB_REF}. This is not a version release." \
              --prerelease --latest=false --target "${GITHUB_SHA}"
          fi

  free-quota:
    name: Free artifact quota
    runs-on: ubuntu-latest
    steps:
      - name: Delete previous workflow artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This calls only the Actions artifacts API. Release assets are never listed or deleted.
          list=$(mktemp)
          page=1
          while true; do
            if ! json=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100&page=${page}"); then
              echo "::warning::Could not list workflow artifacts (page ${page}). Continuing so the installers still build."
              break
            fi
            count=$(echo "$json" | jq '.artifacts | length')
            echo "$json" | jq -r --argjson run "${{ github.run_id }}" '.artifacts[] | select(.workflow_run.id != $run) | "\(.id) \(.name)"' >> "$list" || echo "::warning::Could not read the artifact list on page ${page}."
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done
          if [ ! -s "$list" ]; then
            echo "No workflow artifacts from earlier runs."
            exit 0
          fi
          while read -r id name; do
            [ -z "$id" ] && continue
            if gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${id}"; then
              echo "deleted artifact ${id} (${name})"
            else
              echo "::warning::Could not delete workflow artifact ${id} (${name}). Continuing."
            fi
          done < "$list"
          exit 0

  windows:
    name: Windows installer
    needs: [prepare-release, free-quota]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install and build the workspace UI
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build
        env:
          CI: true

      - name: Install the desktop shell
        run: npm ci

      - name: Build the Windows installer
        run: node desktop/winInstaller.js
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Empty on a fork pull request. The script warns and still builds.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Upload the installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ "$tag" == v*.*.* && "$GITHUB_REF" != refs/tags/$tag ]]; then
            echo "Refusing to upload onto a version release from this ref."
            exit 1
          fi
          shopt -s nullglob
          files=(release/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Windows installer was built."
            exit 1
          fi
          attempt=1
          while [ "$attempt" -le 5 ]; do
            if gh release upload "$tag" "${files[@]}" --clobber --repo "$GH_REPO"; then
              exit 0
            fi
            echo "Upload failed (attempt ${attempt}). Retrying."
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done
          exit 1

  macos:
    name: macOS archive
    needs: [prepare-release, free-quota]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install and build the workspace UI
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build
        env:
          CI: true

      - name: Install the desktop shell
        run: npm ci

      - name: Build the unsigned macOS archive
        run: npx electron-builder --mac dmg zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload the macOS archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ "$tag" == v*.*.* && "$GITHUB_REF" != refs/tags/$tag ]]; then
            echo "Refusing to upload onto a version release from this ref."
            exit 1
          fi
          shopt -s nullglob
          files=(release/*.dmg release/*.zip)
          if [ ${#files[@]} -lt 2 ]; then
            echo "Expected a dmg and a zip."
            exit 1
          fi
          attempt=1
          while [ "$attempt" -le 5 ]; do
            if gh release upload "$tag" "${files[@]}" --clobber --repo "$GH_REPO"; then
              exit 0
            fi
            echo "Upload failed (attempt ${attempt}). Retrying."
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done
          exit 1

  linux:
    name: Linux packages
    needs: [prepare-release, free-quota]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install and build the workspace UI
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build
        env:
          CI: true

      - name: Install the desktop shell
        run: npm ci

      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Build the AppImage and deb
        run: npx electron-builder --linux AppImage deb --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload the Linux packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ "$tag" == v*.*.* && "$GITHUB_REF" != refs/tags/$tag ]]; then
            echo "Refusing to upload onto a version release from this ref."
            exit 1
          fi
          shopt -s nullglob
          files=(release/*.AppImage release/*.deb)
          if [ ${#files[@]} -lt 2 ]; then
            echo "Expected an AppImage and a deb."
            exit 1
          fi
          attempt=1
          while [ "$attempt" -le 5 ]; do
            if gh release upload "$tag" "${files[@]}" --clobber --repo "$GH_REPO"; then
              exit 0
            fi
            echo "Upload failed (attempt ${attempt}). Retrying."
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done
          exit 1

  plugin-includes:
    name: Plugin include check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check plugin and generated includes against UE 5.8 headers
        run: node --test desktop/test/plugin-includes.test.js desktop/test/generated-includes.test.js
